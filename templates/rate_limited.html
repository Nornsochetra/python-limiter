<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>429 - Too Many Requests</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card text-center">
      <span class="stat-icon amber mx-auto mb-3" style="width:64px;height:64px;font-size:2rem;">
        <i class="bi bi-hourglass-split"></i>
      </span>

      <h1 class="fw-bold mb-0" style="font-size:2.6rem;">429</h1>
      <div class="section-sub mb-3">Too many requests</div>

      <p class="mb-3">
        You've hit the rate limit. You'll be able to continue automatically when the
        timer below runs out.
      </p>

      <div id="countdownBox" class="card-soft p-3 mb-3" data-seconds="{{ seconds_left }}">
        <div class="section-sub">Try again in</div>
        <div id="countdown" class="fw-bold" style="font-size:2.4rem; line-height:1.2;">
          --:--
        </div>
        <div class="progress mt-2" style="height:6px;">
          <div id="countdownBar" class="progress-bar bg-warning" style="width:100%"></div>
        </div>
      </div>

      <div class="card-soft p-3 mb-4 text-start">
        <div class="spec">
          <span class="k">Limit</span>
          <span class="v">{{ message }}</span>
        </div>
      </div>

      <a id="retryBtn" href="{{ request.path }}"
         class="btn btn-primary w-100 py-2 disabled" aria-disabled="true">
        <i class="bi bi-arrow-clockwise me-1"></i>Waiting...
      </a>
    </div>
  </div>

  <script>
    (function () {
      const box = document.getElementById('countdownBox');
      const label = document.getElementById('countdown');
      const bar = document.getElementById('countdownBar');
      const btn = document.getElementById('retryBtn');

      const total = parseInt(box.dataset.seconds, 10) || 0;
      let left = total;

      function render() {
        const m = Math.floor(left / 60);
        const s = left % 60;
        label.textContent = m + ':' + String(s).padStart(2, '0');
        bar.style.width = total ? (left / total * 100) + '%' : '0%';
      }

      function enableRetry() {
        box.classList.add('d-none');
        btn.classList.remove('disabled');
        btn.removeAttribute('aria-disabled');
        btn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>Try again';
      }

      render();

      // already expired: just offer the button, never auto-reload (that could loop)
      if (left <= 0) {
        enableRetry();
        return;
      }

      const timer = setInterval(function () {
        left -= 1;
        render();
        if (left <= 0) {
          clearInterval(timer);
          enableRetry();
          location.reload();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
