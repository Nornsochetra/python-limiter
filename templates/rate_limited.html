<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>429 - Too Many Requests</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card text-center">
      <span class="stat-icon amber mx-auto mb-3" style="width:64px;height:64px;font-size:2rem;">
        <i class="bi bi-hourglass-split"></i>
      </span>

      <h1 class="fw-bold mb-0" style="font-size:2.6rem;">429</h1>
      <div class="section-sub mb-3">Too many requests</div>

      <p class="mb-3">
        You've made too many requests in a short time. Please wait a moment and try again.
      </p>

      <div class="card-soft p-3 mb-4 text-start">
        <div class="spec">
          <span class="k">Limit</span>
          <span class="v">{{ message }}</span>
        </div>
        {% if retry_after %}
          <div class="spec">
            <span class="k">Try again in</span>
            <span class="v">up to {{ retry_after }} seconds</span>
          </div>
        {% endif %}
      </div>

      <a href="{{ url_for('index') }}" class="btn btn-primary w-100 py-2">
        <i class="bi bi-arrow-left me-1"></i>Go back
      </a>
    </div>
  </div>
</body>
</html>
