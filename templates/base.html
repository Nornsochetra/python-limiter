<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research Py{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <span class="logo"><i class="bi bi-images"></i></span>
      <h1>{% block heading %}Research Py{% endblock %}</h1>
      <p>{% block subheading %}{% endblock %}</p>
    </div>

    <div class="auth-card">
      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <div class="alert alert-warning py-2 px-3 small d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-circle"></i>{{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>

    <div class="auth-foot">{% block auth_foot %}{% endblock %}</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
